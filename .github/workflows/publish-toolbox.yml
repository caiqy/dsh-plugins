name: Publish Toolbox

on:
  push:
    tags: ['toolbox-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in package.json
        required: true
        type: string
      dry_run:
        description: Build and package only; do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-toolbox
  cancel-in-progress: false

env:
  PACKAGE_NAME: '@caiqy/dsh-plugin-toolbox'
  PACKAGE_DIR: packages/dsh-plugin-toolbox

jobs:
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - run: pnpm install --frozen-lockfile --filter '@caiqy/dsh-plugin-toolbox...'
      - run: pnpm --filter '@caiqy/dsh-plugin-toolbox' typecheck
      - run: pnpm --filter '@caiqy/dsh-plugin-toolbox' build
      - run: pnpm --filter '@caiqy/dsh-plugin-toolbox' test
  publish:
    needs: check-windows
    if: github.repository == 'caiqy/dsh-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - run: npm install --global npm@11
      - name: Guard package identity and version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync(`${process.env.PACKAGE_DIR}/package.json`, 'utf8'));
          const expected = process.env.GITHUB_EVENT_NAME === 'push'
            ? process.env.GITHUB_REF_NAME.replace(/^toolbox-v/, '') : process.env.EXPECTED_VERSION;
          assert.equal(pkg.name, process.env.PACKAGE_NAME);
          assert.equal(pkg.version, expected, 'Commit the requested version before releasing');
          assert.match(pkg.version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/);
          assert.equal(pkg.repository.url, 'git+https://github.com/caiqy/dsh-plugins.git');
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${pkg.version}\n`);
          NODE
      - run: pnpm install --frozen-lockfile --filter '@caiqy/dsh-plugin-toolbox...'
      - run: pnpm --filter '@caiqy/dsh-plugin-toolbox' typecheck
      - run: pnpm --filter '@caiqy/dsh-plugin-toolbox' build
      - run: pnpm --filter '@caiqy/dsh-plugin-toolbox' test
      - run: node --test scripts/release.test.mjs
      - name: Pack the verified build
        working-directory: packages/dsh-plugin-toolbox
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/plugin-release" --json > "$RUNNER_TEMP/release-pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const [pkg] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-pack.json`, 'utf8'));
          assert.equal(pkg.name, process.env.PACKAGE_NAME);
          assert.equal(pkg.version, process.env.RELEASE_VERSION);
          for (const path of ['package.json', 'cordis.patch.yml', 'lib/index.js', 'lib/client.js', 'lib/restart.js', 'res/restart-worker.ps1'])
            assert(pkg.files.some(file => file.path === path), `Missing package resource: ${path}`);
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_TARBALL=${process.env.RUNNER_TEMP}/plugin-release/${pkg.filename}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-${{ env.RELEASE_VERSION }}
          path: ${{ runner.temp }}/plugin-release/*.tgz
          if-no-files-found: error
      - name: Publish with npm trusted publishing
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: npm publish "$RELEASE_TARBALL" --access public --tag dsh --provenance --registry https://registry.npmjs.org/
      - name: Verify public release bytes
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { setTimeout } from 'node:timers/promises';
          const [local] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-pack.json`, 'utf8'));
          for (let attempt = 0; attempt < 40; attempt++) {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(local.name)}`, {
              redirect: 'error', headers: { 'cache-control': 'no-cache' }, signal: AbortSignal.timeout(15000),
            });
            assert(response.ok || response.status === 404, `npm metadata HTTP ${response.status}`);
            const metadata = response.ok ? await response.json() : {};
            const published = metadata.versions?.[local.version];
            if (published) {
              assert.equal(published.dist.integrity, local.integrity);
              assert.equal(metadata['dist-tags'].dsh, local.version);
              const url = new URL(published.dist.tarball);
              assert.equal(url.origin, 'https://registry.npmjs.org');
              const archive = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(60000) });
              if (archive.ok) {
                assert.equal('sha512-' + createHash('sha512').update(Buffer.from(await archive.arrayBuffer())).digest('base64'), local.integrity);
                console.log(`Verified public release ${local.name}@${local.version}`);
                process.exit(0);
              }
            }
            await setTimeout(15000);
          }
          throw new Error('Published version or archive is not publicly available after ten minutes');
          NODE
