name: Sync market index

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_run:
    workflows: ['Publish Web Search']
    types: [completed]
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to synchronize from its published npm dsh tag
        type: choice
        default: all
        options: [all, web-search, browser-skill]

permissions:
  contents: read

concurrency:
  group: sync-market-index
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'caiqy/dsh-plugins' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/release.test.mjs
      - name: Verify public packages and synchronize index
        env:
          PLUGIN: ${{ inputs.plugin || 'all' }}
        run: node scripts/sync-market-index.mjs "$PLUGIN"
      - name: Commit only the verified index
        run: |
          if git diff --quiet -- index.json; then
            echo 'No new indexed releases'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.json
          git commit -m 'chore: sync verified npm releases into market index'
          git push origin HEAD:main
