d":"browserskill-coverage-policy-assertions","name":{"text":"Privacy, scope selection, nonce and unique-window limitation assertions","truncated":false},"status":"passed"},{"argv_display":[{"text":"--input-type=module","truncated":false},{"text":"-e","truncated":false},{"text":"import assert from 'node:assert/strict';\nimport { readFile, writeFile } from 'node:fs/promises';\nimport { createHash } from 'node:crypto';\nimport { join } from 'node:path';\nconst project = 'D:/Caiqy/Projects/Github/dsh-plugins';\nconst root = join(project, 'artifacts/browserskill-upstream-041');\nconst expectedSha = '26ee94324c96d95a069ec4d9656f502dd380e9bfce3d431840e2809ea58c374f';\nconst script = join(project, 'packages/browser-skill/packages/dsh-plugin-browserskill/scripts/test-enhancement-live.mjs');\nconst entries = ['chrome', 'edge'].flatMap(label => ['current', 'follow'].map(scope => ({ label, scope, browserId: label === 'chrome' ? '2303ebf6' : 'd408371e', directory: `candidate04-live-${label}-scope-${scope}-unique` })));\nconst [reports, sourceBytes, archiveBytes] = await Promise.all([\n  Promise.all(entries.map(async entry => JSON.parse(await readFile(join(root, entry.directory, 'report.json'), 'utf8')))),\n  readFile(script), readFile(join(root, 'candidate-04/caiqy-browser-skill-dsh-plugin-0.4.1-dsh.1.tgz')),\n]);\nconst scriptSha256 = createHash('sha256').update(sourceBytes).digest('hex');\nassert.equal(createHash('sha256').update(archiveBytes).digest('hex'), expectedSha);\nconst assertForeground = value => {\n  assert.equal(value.available, true);\n  assert.equal(value.agentWindowFound, true);\n  assert.equal(value.matchingWindowCount, 1);\n  assert.equal(value.foregroundIsAgentWindow, false);\n};\nconst rows = entries.map((entry, index) => {\n  const report = reports[index];\n  assert.equal(report.sha256, expectedSha);\n  assert.equal(report.bytes, 141007);\n  assert.equal(report.requestedScope, entry.scope);\n  if (report.scriptSha256 !== undefined) assert.equal(report.scriptSha256, scriptSha256);\n  assert.equal(report.package.name, '@caiqy/browser-skill-dsh-plugin');\n  assert.equal(report.package.version, '0.4.1-dsh.1');\n  assert.equal(report.outcome, 'accepted-limitations');\n  assert.equal(report.passed, false);\n  assert.equal(report.failures.length, 0);\n  const browser = report.browsers.find(value => value.browser === entry.browserId);\n  assert(browser);\n  assert.equal(browser.connection.extension_version, '0.4.1');\n  assert.equal(browser.connection.extension_protocol_version, '1.8');\n  assert.equal(browser.connection.version_skew, false);\n  assert.equal(browser.connection.unresponsive, false);\n  assert.equal(browser.startNoFocus, true);\n  assert.equal(browser.results.screenshotBackground.limitation, true);\n  const evidence = browser.backgroundScreenshotEvidence[entry.scope];\n  assert.equal(evidence.requestedScope, entry.scope);\n  assert.equal(evidence.before.targetTab.scope, 'agent');\n  assert.equal(evidence.before.targetTab.active, false);\n  assert.equal(evidence.before.siblingTab.scope, 'agent');\n  assert.equal(evidence.before.siblingTab.active, true);\n  assert.equal(evidence.before.sameAgentWindow, true);\n  assertForeground(evidence.before.foreground);\n  assertForeground(evidence.failure.foregroundAfter);\n  assert.equal(evidence.failure.outputExists, false);\n  assert.equal(evidence.failure.attachmentCount, 0);\n  const shots = report.calls.filter(call => call.name === 'bsk_inspect' && call.args.action === 'screenshot' && call.args.fullPage === true);\n  assert.equal(shots.length, 1, `${entry.directory}: exactly one real scope dispatch`);\n  const shot = shots[0];\n  assert.equal(shot.args.scope, entry.scope);\n  assert.equal(shot.error.code, 'cdp_failed');\n  assert(['page_hidden', 'navigation'].includes(shot.error.data.reason));\n  assert.equal(shot.error.data.effect_state, 'unknown');\n  const position = report.calls.indexOf(shot);\n  assert(report.calls.slice(0, position).some(call => call.name === 'bsk_session' && call.args.action === 'sync' && call.result?.control_policy === 'target'));\n  assert(report.calls.slice(position + 1).every(call => call.name === 'bsk_session' && ['stop', 'list'].includes(call.args.action)), `${entry.directory}: no action after unknown`);\n  const final = report.calls.filter(call => call.name === 'bsk_session' && call.args.action === 'list' && call.result).at(-1)?.result;\n  assert(final && final.sessions.length === 0 && final.pendingCleanup === 0);\n  assert.equal(browser.backgroundScreenshotCleanup.stopped, true);\n  return { ...entry, outcome: report.outcome, capturePassed: false, actualScopeCalls: 1, reason: shot.error.data.reason, effectState: 'unknown', uniqueTargetWindowMatchesBefore: 1, uniqueTargetWindowMatchesAfter: 1, foregroundIsTargetWindowBefore: false, foregroundIsTargetWindowAfter: false, targetInactive: true, ownedSiblingActive: true, partialOutput: false, partialAttachmentCount: 0, finalSessions: 0, pendingCleanup: 0, reportScriptSha256: report.scriptSha256 ?? null };\n});\nif (!process.argv.includes('--check-only')) await writeFile(join(root, 'candidate-04/scope-audit-unique.json'), JSON.stringify({ schema: 'browserskill.dsh-scope-audit.v1', packageSha256: expectedSha, scriptSha256, cases: rows, note: 'Four independent new fixtures; official refusals satisfy the accepted evidence branch, never count as image success. Earlier ambiguous window-marker reports remain unchanged and are not substituted.' }, null, 2), { flag: 'wx' });\nconsole.log(JSON.stringify(rows, null, 2));\n","truncated":false},{"text":"--","truncated":false},{"text":"--check-only","truncated":false}],"argv_truncated":false,"cwd_ref":"packages/browser-skill","duration_ms":443,"exit_code":0,"id":"browserskill-unique-scope-evidence","name":{"text":"Four independent real scope reports, unique target windows and no action after unknown","truncated":false},"status":"passed"}],"completed_at":"2026-11-03T10:21:00.846Z","identity_provider":"skill-coordinated